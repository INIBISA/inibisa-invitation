  </g>
  <text x="100" y="270" fill="#d5b36b" font-family="Arial, sans-serif" font-size="17" letter-spacing="7">THE WEDDING OF</text>
  <text x="100" y="365" fill="#fff8e9" font-family="Georgia, serif" font-size="80">Aruna</text>
  <text x="225" y="420" fill="#d5b36b" font-family="Georgia, serif" font-size="46">&amp;</text>
  <text x="100" y="500" fill="#fff8e9" font-family="Georgia, serif" font-size="80">Bima</text>
  <line x1="100" y1="542" x2="430" y2="542" stroke="#d5b36b" stroke-opacity=".7"/>
  <text x="100" y="585" fill="#d5b36b" font-family="Arial, sans-serif" font-size="18" letter-spacing="6">18 · 10 · 2026</text>
  <text x="690" y="645" fill="#f6edda" fill-opacity=".72" font-family="Arial, sans-serif" font-size="17" letter-spacing="5">MIDNIGHT NUSANTARA</text>
