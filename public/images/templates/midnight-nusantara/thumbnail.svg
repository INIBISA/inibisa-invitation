<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="750" viewBox="0 0 1200 750" role="img" aria-labelledby="title description">
  <title id="title">Midnight Nusantara</title>
  <desc id="description">Pratinjau undangan biru malam dengan ornamen geometris emas.</desc>
  <defs>
    <linearGradient id="background" x1="0" y1="0" x2="1" y2="1">
      <stop stop-color="#102b4e"/>
      <stop offset="1" stop-color="#030914"/>
    </linearGradient>
    <pattern id="pattern" width="96" height="96" patternUnits="userSpaceOnUse" patternTransform="rotate(45)">
      <rect x="18" y="18" width="60" height="60" fill="none" stroke="#d5b36b" stroke-opacity=".12"/>
      <rect x="31" y="31" width="34" height="34" fill="none" stroke="#d5b36b" stroke-opacity=".09"/>
    </pattern>
  </defs>
  <rect width="1200" height="750" fill="url(#background)"/>
  <rect x="590" width="610" height="750" fill="url(#pattern)"/>
  <rect width="610" height="750" fill="#030914" fill-opacity=".72"/>
  <rect x="42" y="42" width="1116" height="666" fill="none" stroke="#d5b36b" stroke-width="2"/>
  <rect x="60" y="60" width="1080" height="630" fill="none" stroke="#d5b36b" stroke-opacity=".32"/>
  <g fill="none" stroke="#d5b36b">
    <path d="M42 180 180 42M42 230 230 42M1020 708l138-138M970 708l188-188" stroke-opacity=".65"/>
    <rect x="185" y="100" width="76" height="76" transform="rotate(45 223 138)"/>
